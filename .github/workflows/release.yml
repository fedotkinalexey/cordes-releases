# Builds the Cordes desktop app for a version tag and publishes it here (D183).
# The source is private: it is read with a read-only deploy key
# (SOURCE_DEPLOY_KEY). The update bundles are signed with the updater key
# (TAURI_SIGNING_PRIVATE_KEY, _PASSWORD); the app checks that signature
# before installing anything. The Mac app is code-signed with a stable,
# self-signed identity (CODESIGN_P12, _PASSWORD), so an updated copy is the
# same app to macOS and keeps its keychain access. The Windows installer is not
# code-signed yet (D190). Kept in the source repository as
# desktop/releases-repo/ and copied here by desktop/release.sh.
#
# A tag builds the Mac app and publishes it. Windows is not built for a tag
# (the owner's call, 2026-10-07); "Run workflow" with "windows" ticked builds
# it from any source ref. "Run workflow" keeps the files as the run's
# artifacts and publishes nothing.
name: Build and publish Cordes

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Source branch, tag or commit to build
        default: main
      publish_tag:
        description: Publish an existing source version tag (vX.Y.Z) after a failed build
        type: boolean
        default: false
      windows:
        description: Build the Windows installer too
        type: boolean
        default: false

# Read only, except the job that publishes. Third-party actions are pinned to a
# commit: a moved tag can't change what runs next to the signing keys.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}-${{ inputs.ref }}

env:
  SOURCE_REF: ${{ inputs.ref || github.ref_name }}

jobs:
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Source at ${{ env.SOURCE_REF }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: fedotkinalexey/Cordes-AI
          ref: ${{ env.SOURCE_REF }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: src

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src/desktop/src-tauri

      - name: Backend environment
        run: |
          python -m venv src/backend/.venv
          src/backend/.venv/bin/pip install --upgrade pip
          src/backend/.venv/bin/pip install -r src/backend/requirements.txt pyinstaller==6.22.3

      - name: Web app dependencies
        run: npm ci --prefix src/frontend --no-audit --no-fund

      - name: Code-signing identity
        env:
          CODESIGN_P12: ${{ secrets.CODESIGN_P12 }}
          CODESIGN_P12_PASSWORD: ${{ secrets.CODESIGN_P12_PASSWORD }}
        run: |
          echo "$CODESIGN_P12" | base64 --decode > "$RUNNER_TEMP/codesign.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p build "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p build "$KEYCHAIN"
          security import "$RUNNER_TEMP/codesign.p12" -k "$KEYCHAIN" -P "$CODESIGN_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k build "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          openssl pkcs12 -in "$RUNNER_TEMP/codesign.p12" -clcerts -nokeys -passin env:CODESIGN_P12_PASSWORD -out "$RUNNER_TEMP/codesign.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/codesign.pem"
          rm -f "$RUNNER_TEMP/codesign.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: Cordes Desktop
        run: sh src/desktop/build.sh

      - name: Signature check
        run: |
          APP=src/desktop/src-tauri/target/release/bundle/macos/Cordes.app
          codesign --verify --deep --strict "$APP"
          codesign -dr - "$APP"
          codesign -dr - "$APP/Contents/Resources/cordes-server/cordes-server"

      - name: The built server starts and answers
        run: python3 src/desktop/smoke.py src/desktop/src-tauri/target/release/bundle/macos/Cordes.app/Contents/Resources/cordes-server/cordes-server

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos
          if-no-files-found: error
          path: |
            src/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            src/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            src/desktop/src-tauri/target/release/bundle/dmg/*.dmg

  windows:
    name: Windows (x64)
    if: ${{ inputs.windows == true }}
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Source at ${{ env.SOURCE_REF }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: fedotkinalexey/Cordes-AI
          ref: ${{ env.SOURCE_REF }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: src

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src/desktop/src-tauri

      - name: Backend environment
        run: |
          python -m venv src/backend/.venv
          src/backend/.venv/Scripts/python.exe -m pip install --upgrade pip
          src/backend/.venv/Scripts/python.exe -m pip install -r src/backend/requirements.txt pyinstaller==6.22.3

      - name: Tests that matter on Windows (folders, commands, keychain, backups)
        working-directory: src/backend
        run: >
          .venv/Scripts/python.exe -m pytest -q
          tests/test_windows.py tests/test_computer.py tests/test_computer_policy.py tests/test_computer_undo.py
          tests/test_backup.py tests/test_desktop_settings.py tests/test_remembered.py

      - name: Web app dependencies
        run: npm ci --prefix src/frontend --no-audit --no-fund

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: sh src/desktop/build.sh

      - name: The built server starts and answers
        run: python src/desktop/smoke.py src/desktop/build/cordes-server/cordes-server.exe

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            src/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            src/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig

  publish:
    name: Publish the release
    if: github.event_name == 'push' || (inputs.publish_tag && github.ref == 'refs/heads/main' && startsWith(inputs.ref, 'v'))
    needs: [macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Release scripts and notes at ${{ env.SOURCE_REF }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: fedotkinalexey/Cordes-AI
          ref: ${{ env.SOURCE_REF }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: src
          sparse-checkout: desktop

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: built

      - name: Release files
        run: |
          python3 src/desktop/release_files.py \
            --bundle built/macos \
            --tag "${SOURCE_REF}" \
            --repo "${GITHUB_REPOSITORY}" \
            --changelog src/desktop/CHANGELOG.md \
            --out out

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${SOURCE_REF}" --verify-tag out/*.dmg out/*.app.tar.gz out/*.app.tar.gz.sig out/latest.json \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Cordes ${SOURCE_REF#v}" \
            --notes-file out/notes.md
