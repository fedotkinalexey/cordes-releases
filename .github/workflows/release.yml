# Builds the Cordes desktop app for a version tag and publishes it here (D183).
# The source is private: it is read with a read-only deploy key
# (SOURCE_DEPLOY_KEY). The update bundle is signed with the updater key
# (TAURI_SIGNING_PRIVATE_KEY, _PASSWORD); the app checks that signature
# before installing anything. Kept in the source repository as
# desktop/releases-repo/ and copied here by desktop/release.sh.
name: Build and publish Cordes

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Source at ${{ github.ref_name }}
        uses: actions/checkout@v4
        with:
          repository: fedotkinalexey/Cordes-AI
          ref: ${{ github.ref_name }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          path: src

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/desktop/src-tauri

      - name: Backend environment
        run: |
          python -m venv src/backend/.venv
          src/backend/.venv/bin/pip install --upgrade pip
          src/backend/.venv/bin/pip install -r src/backend/requirements.txt pyinstaller==6.22.3

      - name: Web app dependencies
        run: npm ci --prefix src/frontend --no-audit --no-fund

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: sh src/desktop/build.sh

      - name: Release files
        run: |
          python3 src/desktop/release_files.py \
            --bundle src/desktop/src-tauri/target/release/bundle \
            --tag "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --changelog src/desktop/CHANGELOG.md \
            --out out

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/*.dmg out/*.app.tar.gz out/*.app.tar.gz.sig out/latest.json \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Cordes ${GITHUB_REF_NAME#v}" \
            --notes-file out/notes.md
